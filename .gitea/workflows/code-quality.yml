name: Build matrix

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Debug
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/${{ matrix.compiler }}-${{ matrix.build_type }}
      CCACHE_DIR: build/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine submodule revision
        id: submodule-revision
        shell: bash
        run: |
          echo "hash=$(git submodule status | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore submodules
        id: submodules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .agents/Agents
            dependencies
            .git/modules
          key: nexium-submodules-v1-${{ steps.submodule-revision.outputs.hash }}

      - name: Initialize submodules on cache miss
        if: steps.submodules-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: nexium-build-v1-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            nexium-build-v1-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Show selected toolchain
        shell: bash
        run: |
          command -v "$CC"
          command -v "$CXX"
          cmake --version

      - name: Configure CMake (${{ matrix.build_type }})
        shell: bash
        run: |
          time cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"

      - name: Build and show link commands
        shell: bash
        run: |
          time cmake --build "$BUILD_DIR" --parallel --verbose

      - name: Save build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Save submodules
        if: success() && steps.submodules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .agents/Agents
            dependencies
            .git/modules
          key: ${{ steps.submodules-cache.outputs.cache-primary-key }}
