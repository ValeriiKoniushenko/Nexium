name: Code Quality
on: pull_request

permissions:
  contents: read
  pull-requests: write

env:
  JOBS: '20'
  COMPILER: gcc
  BUILD_TYPE: Debug
  CACHE_VARIANT: cache/gcc/debug
  PROJECT_DIR: /workspace/Vakon/Nexium/cache/gcc/debug
  BUILD_DIR: /cache/build/gcc/debug
  CCACHE_DIR: /ccache/gcc/debug

jobs:
  build:
    name: Build
    runs-on: linux
    concurrency:
      group: code-quality-gcc-debug
      cancel-in-progress: false
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/git-repo:/workspace/Vakon/Nexium/cache
        - /srv/ci-cache/build-cache:/cache/build
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          fetch-depth: 0
          path: ${{ env.CACHE_VARIANT }}

      - name: Init submodules
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs "$JOBS" \
            dependencies/JustReflectMe dependencies/Utils

          set -- .agents/Agents dependencies/assimp dependencies/freetype \
            dependencies/glfw dependencies/spdlog scripts
          CACHE_KEY="$(date -u +%G-%V)-$(git ls-tree HEAD -- "$@" | sha256sum | cut -d' ' -f1)"
          CACHE_STAMP=.git/third-party-submodules.cache
          if [ ! -f "$CACHE_STAMP" ] || [ "$(cat "$CACHE_STAMP")" != "$CACHE_KEY" ] || \
             git submodule status --recursive "$@" | grep -Eq '^[-+U]'; then
            git submodule update --init --recursive --depth 1 --jobs "$JOBS" "$@"
            printf '%s\n' "$CACHE_KEY" > "$CACHE_STAMP"
          fi

      - name: Copyright
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          COPYRIGHT_FAILED=0
          python3 .gitea/check_copyright.py \
            --report-path "$RUNNER_TEMP/copyright-report.json" || COPYRIGHT_FAILED=1
          python3 .gitea/publish_copyright.py \
            --report-path "$RUNNER_TEMP/copyright-report.json" || COPYRIGHT_FAILED=1
          printf 'COPYRIGHT_FAILED=%s\n' "$COPYRIGHT_FAILED" >> "$GITHUB_ENV"

      - name: Clang-format
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          CLANG_FORMAT_FAILED=0
          python3 .gitea/check_clang_format.py || CLANG_FORMAT_FAILED=1
          printf 'CLANG_FORMAT_FAILED=%s\n' "$CLANG_FORMAT_FAILED" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          case "$COMPILER" in
            clang) export CC=clang CXX=clang++ ;;
            gcc) export CC=gcc CXX=g++ ;;
            *) exit 1 ;;
          esac
          "$CXX" --version
          BENCHMARKS_DISABLED=ON
          if [ "$BUILD_TYPE" = Release ]; then BENCHMARKS_DISABLED=OFF; fi
          cmake -S "$PROJECT_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DNEXIUM_DISABLE_TESTS=OFF \
            -DNEXIUM_DISABLE_BENCHMARKS="$BENCHMARKS_DISABLED" \
            -DNEXIUM_ENABLE_3D_MODULE="OFF" \
            -DNEXIUM_VERIFY_INTERFACE_HEADER_SETS=ON \
            -DNEXIUM_ENABLE_LAYER_CHECKS=ON

      - name: Clang-tidy
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: timeout 10m python3 .gitea/check_clang_tidy.py --build-dir "$BUILD_DIR" --fail-on error

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel "$JOBS"

      - name: Capture TemplateGame UI
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          SCREENSHOT="$RUNNER_TEMP/template-game-ui.png"
          timeout 2m python3 .gitea/capture_game_ui.py \
            --executable "$BUILD_DIR/bin/TemplateGame" \
            --output "$SCREENSHOT"
          {
            echo "## TemplateGame UI"
            echo "Captured and published \`template-game-ui.png\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: timeout 3m "$BUILD_DIR/bin/Nexium_Tests"

      - name: Unit tests under Valgrind
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: timeout 5m python3 .gitea/check_valgrind.py --executable "$BUILD_DIR/bin/Nexium_Tests" --verbose

      - name: Headless game under Valgrind
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: timeout 8m python3 .gitea/run_game_valgrind.py --executable "$BUILD_DIR/bin/TemplateGame" --timeout 5

      - name: Precheck results
        if: always()
        run: |
          PRECHECK_FAILED=0
          if [ "${COPYRIGHT_FAILED:-0}" -ne 0 ]; then
            echo "Copyright precheck failed."
            PRECHECK_FAILED=1
          fi
          if [ "${CLANG_FORMAT_FAILED:-0}" -ne 0 ]; then
            echo "Clang-format precheck failed."
            PRECHECK_FAILED=1
          fi
          exit "$PRECHECK_FAILED"
