name: Code Quality

on:
  pull_request:
  push:
    branches:
      - develop

# Build caches are persistent runner-host mounts. Serializing workflow runs keeps
# separate runs from writing the same compiler-specific cache concurrently. Every
# job still gets its own checkout, so sibling jobs never share a Git worktree.
concurrency:
  group: nexium-ci-build-cache
  cancel-in-progress: false

jobs:
  fmt-clang-format:
    name: "[fmt] clang-format 19.1.7"
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/check_clang_format.py --base develop

  build-clang:
    name: "[build] clang 19.1.7 (linux)"
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/nexium/build-clang-debug-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible Clang Debug build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible Clang Debug build cache; configuring from scratch"
          fi

      - name: Configure Debug
        run: |
          echo "::group::CMake configure"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build Debug
        run: |
          echo "::group::Build"
          cmake --build build -j$(nproc)
          echo "::endgroup::"
          {
            echo "## Build: clang 19.1.7"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

      - name: Upload Clang runtime executables
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: nexium-clang-runtime
          path: |
            build/bin/Nexium_Tests
            build/bin/TemplateGame
          if-no-files-found: error
          retention-days: 1

  build-gcc:
    name: "[build] gcc 14.2.0 (linux)"
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/nexium/build-gcc-debug-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: gcc
      CXX: g++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible GCC Debug build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible GCC Debug build cache; configuring from scratch"
          fi

      - name: Configure Debug
        run: |
          echo "::group::CMake configure"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build Debug
        run: |
          echo "::group::Build"
          cmake --build build -j$(nproc)
          echo "::endgroup::"
          {
            echo "## Build: gcc 14.2.0"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

  test-clang:
    name: "[test] unit tests (clang)"
    needs: build-clang
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Clang runtime executables
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: nexium-clang-runtime
          path: build/bin

      - name: Prepare runtime executables
        run: chmod +x build/bin/Nexium_Tests build/bin/TemplateGame

      - name: Run ECS tests
        run: |
          echo "::group::Nexium_Tests"
          build/bin/Nexium_Tests
          echo "::endgroup::"

  ui-template-game:
    name: "[ui] template-game capture (clang)"
    needs: build-clang
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Clang runtime executables
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: nexium-clang-runtime
          path: build/bin

      - name: Prepare runtime executables
        run: chmod +x build/bin/Nexium_Tests build/bin/TemplateGame

      - name: Capture and publish TemplateGame UI
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/capture_game_ui.py --executable build/bin/TemplateGame --output template-game-ui.png
          {
            echo "## TemplateGame UI"
            echo "Captured \`template-game-ui.png\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test-template-game-valgrind:
    name: "[test] template-game valgrind (clang)"
    needs: build-clang
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Clang runtime executables
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: nexium-clang-runtime
          path: build/bin

      - name: Prepare runtime executables
        run: chmod +x build/bin/Nexium_Tests build/bin/TemplateGame

      - name: Run TemplateGame under Valgrind
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/run_game_valgrind.py --executable build/bin/TemplateGame --timeout 5

  test-valgrind:
    name: "[test] valgrind (clang)"
    needs: build-clang
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Clang runtime executables
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: nexium-clang-runtime
          path: build/bin

      - name: Prepare runtime executables
        run: chmod +x build/bin/Nexium_Tests build/bin/TemplateGame

      - name: Check Valgrind
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_valgrind.py --executable build/bin/Nexium_Tests --verbose \
            | tee valgrind-output.txt
          {
            echo "## Valgrind (Nexium_Tests)"
            echo '```'
            tail -30 valgrind-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint-clang-tidy:
    name: "[lint] clang-tidy 19.1.7"
    needs: build-clang
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/nexium/build-clang-debug-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch develop for diffing
        run: |
          echo "::group::Ensuring develop is available for diffing"
          git fetch origin develop:refs/remotes/origin/develop
          echo "::endgroup::"

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible Clang Debug build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible Clang Debug build cache; configuring from scratch"
          fi

      - name: Configure Debug for analysis
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Generate reflection headers
        run: cmake --build build --target CodeGenerator -j$(nproc)

      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/check_clang_tidy.py --base develop --build-dir build --fail-on error
