name: Clang Debug
on: push
jobs:
  build:
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (parallel)
        run: |
          git submodule sync --recursive
          JOBS=$(( $(nproc) / 4 ))
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
          echo "Using $JOBS submodule jobs"
          git submodule update --init --depth 1 --jobs "$JOBS"

      - run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel