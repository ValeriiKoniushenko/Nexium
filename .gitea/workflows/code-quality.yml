name: Code Quality

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  clang-format:
    name: clang-format
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed: diffing against develop

      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_format.py --base develop

  build:
    name: "Build: Linux | Clang 18.1"
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNEXIUM_DISABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 1

  clang-tidy:
    name: clang-tidy
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Fetch develop for diffing
        run: |
          git fetch --depth=1 origin develop:refs/remotes/origin/develop

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_tidy.py --base develop --build-dir build