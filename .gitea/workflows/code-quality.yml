name: Code Quality

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  clang-format:
    name: clang-format
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed: diffing against develop

      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_format.py --base develop

  build:
    name: "Build: Linux | Clang 22.1.8"
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/git-repo:/repo-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    steps:
      - name: Sync repo cache
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          REPO_URL="https://oauth2:${GITEATOKEN}@gitea.vakon.dev/${GITHUB_REPOSITORY}.git"

          if [ -d /repo-cache/.git ]; then
            echo "Using existing repo cache"
            cd /repo-cache
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$GITHUB_SHA"
            git checkout -f "$GITHUB_SHA"
            git submodule sync --recursive
            git submodule update --init --recursive --depth=1
          else
            echo "No cache found, cloning fresh"
            git clone --recurse-submodules --shallow-submodules "$REPO_URL" /repo-cache
            cd /repo-cache
            git fetch --depth=1 origin "$GITHUB_SHA"
            git checkout -f "$GITHUB_SHA"
          fi

          echo "Copying into workspace"
          mkdir -p "$GITHUB_WORKSPACE"
          cp -a /repo-cache/. "$GITHUB_WORKSPACE"/

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNEXIUM_DISABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: build/
          retention-days: 5

clang-tidy:
    name: clang-tidy
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/git-repo:/repo-cache
    steps:
      - name: Sync repo cache
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          REPO_URL="https://oauth2:${GITEATOKEN}@gitea.vakon.dev/${GITHUB_REPOSITORY}.git"
          cd /repo-cache
          git remote set-url origin "$REPO_URL"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -f "$GITHUB_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
          mkdir -p "$GITHUB_WORKSPACE"
          cp -a /repo-cache/. "$GITHUB_WORKSPACE"/

      - name: Fetch develop for diffing
        run: |
          git fetch --depth=1 origin develop:refs/remotes/origin/develop

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-output
          path: build/

      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_tidy.py --base develop --build-dir build