name: Code Quality
on: push

env:
  JOBS: '20'

jobs:
  build:
    name: Build
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs "$JOBS"

      - name: Configure
        env:
          COMPILER: gcc
          BUILD_TYPE: Debug
        run: |
          case "$COMPILER" in
            clang) export CC=clang CXX=clang++ ;;
            gcc) export CC=gcc CXX=g++ ;;
            *) exit 1 ;;
          esac
          "$CXX" --version
          BENCHMARKS_DISABLED=ON
          if [ "$BUILD_TYPE" = Release ]; then BENCHMARKS_DISABLED=OFF; fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DNEXIUM_DISABLE_TESTS=OFF \
            -DNEXIUM_DISABLE_BENCHMARKS="$BENCHMARKS_DISABLED" \
            -DNEXIUM_ENABLE_3D_MODULE="OFF" \
            -DNEXIUM_VERIFY_INTERFACE_HEADER_SETS=ON \
            -DNEXIUM_ENABLE_LAYER_CHECKS=ON

      - name: Build
        run: cmake --build build --parallel "$JOBS"

      - name: Unit tests
        run: timeout 3m build/bin/Nexium_Tests

      - name: Unit tests under Valgrind
        run: timeout 5m python3 .gitea/check_valgrind.py --executable build/bin/Nexium_Tests --no-gitea --verbose

      - name: Headless game under Valgrind
        run: timeout 8m python3 .gitea/run_game_valgrind.py --executable build/bin/TemplateGame --timeout 5 --no-gitea
