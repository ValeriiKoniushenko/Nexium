name: Code Quality

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  clang-format:
    name: clang-format
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed: diffing against develop

      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_format.py --base develop

  build:
    name: "Build: Linux | Clang 18.1"
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/git-repo:/repo-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    steps:
      - name: Debug env
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_SERVER_URL=$GITHUB_SERVER_URL"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "GITHUB_SHA=$GITHUB_SHA"
      - name: Sync repo cache
        run: |
          if [ -d /repo-cache/.git ]; then
            cd /repo-cache
            git fetch --depth=1 origin "$GITHUB_REF" || git fetch origin
            git checkout -f FETCH_HEAD
            git submodule sync --recursive
            git submodule update --init --recursive --depth=1
          else
            git clone --depth=1 --recurse-submodules --shallow-submodules \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" /repo-cache
            cd /repo-cache
            git fetch --depth=1 origin "$GITHUB_REF"
            git checkout -f FETCH_HEAD
          fi
          cp -a /repo-cache/. "$GITHUB_WORKSPACE"/

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNEXIUM_DISABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 1

  clang-tidy:
    name: clang-tidy
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Fetch develop for diffing
        run: |
          git fetch --depth=1 origin develop:refs/remotes/origin/develop

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_tidy.py --base develop --build-dir build