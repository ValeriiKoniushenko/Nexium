name: C++ Code Quality

on:
  workflow_call:
    inputs:
      ci_root:
        description: Path to the checked-out common CI submodule in the caller
        required: false
        type: string
        default: .gitea/ci
      project_config:
        description: Path to this consumer's project CI JSON configuration
        required: false
        type: string
        default: .ci/cpp-ci.json
    secrets:
      GITEATOKEN:
        required: false

# No checkout or CMake/Ninja directory is shared between jobs.  ccache is the
# only persistent compiler cache; it is designed for concurrent clients.
concurrency:
  group: cpp-ci-${{ gitea.repository }}
  cancel-in-progress: false

env:
  CPP_CI_ROOT: ${{ inputs.ci_root }}
  CPP_CI_CONFIG: ${{ inputs.project_config }}

jobs:
  clang-format:
    name: "[fmt] clang-format"
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 15
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check changed C/C++ formatting
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" format --config "$ci_config"

  clang-tidy:
    name: "[lint] clang-tidy"
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/cpp-ci-tidy:/clang-tidy-cache
    env:
      CCACHE_DIR: /ccache
    timeout-minutes: 35
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure and check changed C/C++ with clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" tidy --config "$ci_config"

  build:
    name: "[build] ${{ matrix.label }}"
    runs-on: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: clang-debug
            label: clang Debug
          - profile: clang-release
            label: clang Release
          - profile: gcc-debug
            label: gcc Debug
          - profile: gcc-release
            label: gcc Release
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
    timeout-minutes: 40
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure ${{ matrix.label }} with ccache
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" configure --config "$ci_config" --profile "${{ matrix.profile }}"

      - name: Build ${{ matrix.label }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" build --config "$ci_config" --profile "${{ matrix.profile }}"

      - name: Stage runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-stage --config "$ci_config" --profile "${{ matrix.profile }}"

      - name: Upload ${{ matrix.label }} runtime artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: cpp-ci-runtime-${{ matrix.profile }}
          path: ci-artifacts/cpp-ci-runtime-${{ matrix.profile }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    name: "[test] ${{ matrix.label }}"
    needs: build
    runs-on: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: clang-debug
            label: unit tests / clang Debug
          - profile: clang-release
            label: unit tests / clang Release
          - profile: gcc-debug
            label: unit tests / gcc Debug
          - profile: gcc-release
            label: unit tests / gcc Release
    container:
      image: cpp-ci:latest
    timeout-minutes: 20
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ${{ matrix.label }} runtime artifact
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: cpp-ci-runtime-${{ matrix.profile }}
          path: ci-artifacts

      - name: Restore runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-restore --config "$ci_config" --profile "${{ matrix.profile }}"

      - name: Run ${{ matrix.label }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" test --config "$ci_config" --profile "${{ matrix.profile }}"

  valgrind:
    name: "[test] Valgrind / clang Debug"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 25
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download clang Debug runtime artifact
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: cpp-ci-runtime-clang-debug
          path: ci-artifacts

      - name: Restore clang Debug runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-restore --config "$ci_config" --profile clang-debug

      - name: Run unit tests under Valgrind (copyable suppressions in output)
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" valgrind --config "$ci_config" --profile clang-debug

  runtime-capture:
    name: "[ui] configured application capture / clang Debug"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 20
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download clang Debug runtime artifact
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: cpp-ci-runtime-clang-debug
          path: ci-artifacts

      - name: Restore clang Debug runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-restore --config "$ci_config" --profile clang-debug

      - name: Capture configured application when enabled
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" runtime-capture --config "$ci_config" --if-enabled

      - name: Upload configured application screenshot
        if: always()
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: cpp-ci-runtime-screenshot
          path: ci-runtime/application-ui.png
          if-no-files-found: warn
          retention-days: 1

  runtime-valgrind:
    name: "[test] configured application Valgrind / clang Debug"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 25
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download clang Debug runtime artifact
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: cpp-ci-runtime-clang-debug
          path: ci-artifacts

      - name: Restore clang Debug runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-restore --config "$ci_config" --profile clang-debug

      - name: Run configured application under Valgrind when enabled
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" runtime-valgrind --config "$ci_config" --if-enabled
