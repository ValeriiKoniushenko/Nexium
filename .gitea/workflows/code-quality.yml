name: Code Quality
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: linux
    concurrency:
      group: code-quality-gcc-debug
      cancel-in-progress: false
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/git-repo:/workspace/Vakon/Nexium/cache
        - /srv/ci-cache/build-cache:/cache/build
    steps:
      - uses: actions/checkout@v3
        with: {submodules: false, fetch-depth: 0, path: cache/gcc/debug}
      - name: Init submodules
        working-directory: cache/gcc/debug
        run: |
          . .gitea/ci-config.sh
          git submodule update --init --recursive --depth 1 --jobs "$CI_JOBS" scripts
          sh scripts/ci/gitea/runners/prepare_checkout.sh .gitea/ci-config.sh
      - name: CI helper tests
        working-directory: cache/gcc/debug
        run: python3 -m unittest discover -s scripts/ci/gitea/tests -v
      - name: Copyright
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          COPYRIGHT_FAILED=0
          sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh copyright || COPYRIGHT_FAILED=1
          sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh publish-copyright || COPYRIGHT_FAILED=1
          printf 'COPYRIGHT_FAILED=%s\n' "$COPYRIGHT_FAILED" >> "$GITHUB_ENV"
      - name: Clang-format
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          CLANG_FORMAT_FAILED=0
          sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh format || CLANG_FORMAT_FAILED=1
          printf 'CLANG_FORMAT_FAILED=%s\n' "$CLANG_FORMAT_FAILED" >> "$GITHUB_ENV"
      - name: Configure GCC Debug
        working-directory: cache/gcc/debug
        run: sh scripts/ci/gitea/runners/configure_variant.sh .gitea/ci-config.sh gcc
      - name: Clang-tidy
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: timeout 10m sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh tidy
      - name: Build GCC Debug
        working-directory: cache/gcc/debug
        run: sh scripts/ci/gitea/runners/build_variant.sh .gitea/ci-config.sh gcc
      - uses: actions/checkout@v3
        with: {submodules: false, fetch-depth: 0, path: cache/clang/debug}
      - name: Init Clang submodules
        working-directory: cache/clang/debug
        run: |
          . .gitea/ci-config.sh
          git submodule update --init --recursive --depth 1 --jobs "$CI_JOBS" scripts
          sh scripts/ci/gitea/runners/prepare_checkout.sh .gitea/ci-config.sh
      - name: Configure Clang Debug
        working-directory: cache/clang/debug
        run: sh scripts/ci/gitea/runners/configure_variant.sh .gitea/ci-config.sh clang
      - name: Build Clang Debug
        working-directory: cache/clang/debug
        run: sh scripts/ci/gitea/runners/build_variant.sh .gitea/ci-config.sh clang
      - name: Capture TemplateGame UI
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh capture-ui
          echo '## TemplateGame UI' >> "$GITHUB_STEP_SUMMARY"
          echo 'Captured and published `template-game-ui.png`.' >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests
        working-directory: cache/gcc/debug
        run: sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh tests
      - name: Configure unit-test coverage
        working-directory: cache/gcc/debug
        run: sh scripts/ci/gitea/runners/configure_coverage.sh .gitea/ci-config.sh
      - name: Generate unit-test coverage
        working-directory: cache/gcc/debug
        run: sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh coverage
      - name: Publish unit-test coverage
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: |
          sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh publish-coverage
          . .gitea/ci-config.sh
          {
            echo '## Unit-test coverage'
            echo '```text'
            tail -n 3 "$CI_COVERAGE_BUILD_DIR/coverage-report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests under Valgrind
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh valgrind-tests
      - name: Headless game under Valgrind
        working-directory: cache/gcc/debug
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_AUTH_SCHEME: Bearer
        run: sh scripts/ci/gitea/runners/run_ci_check.sh .gitea/ci-config.sh valgrind-game
      - name: Precheck results
        if: always()
        run: |
          PRECHECK_FAILED=0
          if [ "${COPYRIGHT_FAILED:-0}" -ne 0 ]; then
            echo "Copyright precheck failed."
            PRECHECK_FAILED=1
          fi
          if [ "${CLANG_FORMAT_FAILED:-0}" -ne 0 ]; then
            echo "Clang-format precheck failed."
            PRECHECK_FAILED=1
          fi
          exit "$PRECHECK_FAILED"
