name: Build matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Debug
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/${{ matrix.compiler }}-${{ matrix.build_type }}

    steps:
      # Avoid downloading actions/checkout from an external action registry.  Fetch the
      # exact commit selected by Gitea, while limiting the job token to read-only access.
      - name: Checkout source and submodules
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITEA_TOKEN }}
          CHECKOUT_SERVER_URL: ${{ gitea.server_url }}
          CHECKOUT_REPOSITORY: ${{ gitea.repository }}
          CHECKOUT_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail

          server_url="${CHECKOUT_SERVER_URL%/}"
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"

          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config --local \
            "http.${server_url}/.extraheader" "Authorization: Basic ${auth_header}"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "${server_url}/${CHECKOUT_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" submodule update --init --recursive --depth=1

      - name: Show selected toolchain
        shell: bash
        run: |
          command -v "$CC"
          command -v "$CXX"
          cmake --version

      - name: Configure CMake (${{ matrix.build_type }})
        shell: bash
        run: |
          time cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build and show link commands
        shell: bash
        run: |
          time cmake --build "$BUILD_DIR" --parallel --verbose
