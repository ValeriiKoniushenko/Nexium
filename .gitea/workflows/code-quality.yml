name: Build matrix

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Debug
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/${{ matrix.compiler }}-${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          report_elapsed() {
            status=$?
            echo "METRIC: toolchain inspection completed in ${SECONDS}s (exit ${status})"
          }
          trap report_elapsed EXIT

          command -v "$CC"
          command -v "$CXX"
          cmake --version

      - name: Configure CMake (${{ matrix.build_type }})
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          report_elapsed() {
            status=$?
            echo "METRIC: CMake configure completed in ${SECONDS}s (exit ${status})"
          }
          trap report_elapsed EXIT

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build and show link commands
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          report_elapsed() {
            status=$?
            echo "METRIC: CMake build completed in ${SECONDS}s (exit ${status})"
          }
          trap report_elapsed EXIT

          cmake --build "$BUILD_DIR" --parallel --verbose

      - name: Inspect linked executables
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          report_elapsed() {
            status=$?
            echo "METRIC: link inspection completed in ${SECONDS}s (exit ${status})"
          }
          trap report_elapsed EXIT

          while IFS= read -r executable; do
            echo "===== $executable ====="
            file "$executable"
            ldd "$executable" || true
          done < <(find "$BUILD_DIR/bin" -maxdepth 1 -type f -executable -print | sort)
