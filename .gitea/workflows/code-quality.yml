name: C++ Code Quality

on:
  # Keep this checkout useful until .gitea is extracted into the shared CI
  # repository. For direct events the empty workflow_call inputs below fall
  # back to .gitea and .ci/cpp-ci.json in each shell step.
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      ci_root:
        description: Path to the checked-out common CI submodule in the caller
        required: false
        type: string
        default: .gitea/ci
      project_config:
        description: Path to this consumer's project CI JSON configuration
        required: false
        type: string
        default: .ci/cpp-ci.json
    secrets:
      GITEATOKEN:
        required: false

# No checkout or CMake/Ninja directory is shared between jobs. ccache and the
# append-only Git object cache are persistent; each job still owns its own
# worktrees and Git configuration.
concurrency:
  group: cpp-ci-${{ gitea.repository }}
  cancel-in-progress: false

env:
  CPP_CI_ROOT: ${{ inputs.ci_root }}
  CPP_CI_CONFIG: ${{ inputs.project_config }}
  CPP_CI_SUBMODULE_CACHE_ROOT: /submodule-cache

jobs:
  clang-format:
    name: "[fmt] clang-format"
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 15
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize shared CI module when necessary
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          if [ ! -f "$ci_root/bin/cpp-ci.py" ]; then
            git submodule sync -- "$ci_root"
            git submodule update --init --depth 1 -- "$ci_root"
          fi

      - name: Remove previous CI pull-request comments
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          python3 "$ci_root/bin/cpp-ci.py" cleanup

      - name: Check changed C/C++ formatting
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" format --config "$ci_config"

  build-clang-debug:
    name: "[build] clang Debug"
    needs: clang-format
    # Formatting is an independent quality gate: report its failure, but do not
    # prevent the compiler/test feedback from being collected.
    if: ${{ always() }}
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/cpp-ci-submodules:/submodule-cache
    env:
      CCACHE_DIR: /ccache
    timeout-minutes: 40
    steps:
      - name: Checkout this job only
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize shared CI module when necessary
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          if [ ! -f "$ci_root/bin/cpp-ci.py" ]; then
            git submodule sync -- "$ci_root"
            git submodule update --init --depth 1 -- "$ci_root"
          fi

      - name: Materialize pinned build submodules from object cache
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          python3 "$ci_root/bin/cpp-ci.py" submodules \
            --cache-root "${CPP_CI_SUBMODULE_CACHE_ROOT:-/submodule-cache}"

      - name: Configure clang Debug with ccache
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" configure --config "$ci_config" --profile clang-debug

      - name: Build clang Debug
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" build --config "$ci_config" --profile clang-debug

      - name: Stage clang Debug compilation database
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" compile-db-stage --config "$ci_config" --profile clang-debug

      - name: Upload clang Debug compilation database
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: cpp-ci-compile-commands-clang-debug
          path: ci-artifacts/cpp-ci-compile-commands-clang-debug.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Stage clang Debug runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-stage --config "$ci_config" --profile clang-debug

      - name: Upload clang Debug runtime artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: cpp-ci-runtime-clang-debug
          path: ci-artifacts/cpp-ci-runtime-clang-debug.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-clang-release:
    name: "[build] clang Release"
    needs: clang-format
    if: ${{ always() }}
    runs-on: linux
    container:
      image: cpp-ci:latest
