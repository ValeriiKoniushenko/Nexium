            --cache-root "${CPP_CI_SUBMODULE_CACHE_ROOT:-/submodule-cache}"

      - name: Configure clang Release with ccache
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" configure --config "$ci_config" --profile clang-release

      - name: Build clang Release
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" build --config "$ci_config" --profile clang-release

      - name: Stage clang Release runtime artifact
        run: |
          ci_root="${CPP_CI_ROOT:-.gitea}"
          ci_config="${CPP_CI_CONFIG:-.ci/cpp-ci.json}"
          python3 "$ci_root/bin/cpp-ci.py" artifact-stage --config "$ci_config" --profile clang-release

      - name: Upload clang Release runtime artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: cpp-ci-runtime-clang-release
          path: ci-artifacts/cpp-ci-runtime-clang-release.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-gcc-debug:
