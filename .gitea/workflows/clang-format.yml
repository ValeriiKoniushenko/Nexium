name: clang-format

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  clang-format:
    runs-on: ubuntu-latest

    container:
      image: cpp-ci:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check clang-format
        run: |
          python3 .ci/check_clang_format.py --base develop --report-path clang-format-report.json

      - name: Upload clang-format report
        uses: actions/upload-artifact@v3
        with:
          name: clang-format-report
          path: clang-format-report.json
