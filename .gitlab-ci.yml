stages:
  - lint

clang-format:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      FILES=$(git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD \
        | grep -E '\.(cpp|h)$' || true)

      if [ -z "$FILES" ]; then
        echo "No C/C++ files changed, skipping."
        exit 0
      fi

      echo "Checking files:"
      echo "$FILES"
      echo "$FILES" | xargs clang-format-20 --style=file --dry-run --Werror